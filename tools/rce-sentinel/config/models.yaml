    - { id: "mimo-v2.6-pro:cloud", provider: ollama, family: xiaomi, price_in: 0.0, price_out: 0.0, price_cached_in: 0.0, context_tokens: 262144, uses: [bench], quality: 0.75, tps: 50 }
