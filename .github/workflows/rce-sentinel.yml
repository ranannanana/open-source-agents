name: rce-sentinel

on:
  push:
    paths: ["tools/rce-sentinel/**", ".github/workflows/rce-sentinel.yml"]
  pull_request:
    paths: ["tools/rce-sentinel/**", ".github/workflows/rce-sentinel.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/rce-sentinel
    env:
      # Offline by design: no keys, no model servers, mock provider.
      RCE_SENTINEL_OFFLINE: "1"
      RCE_SENTINEL_NO_ENV_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
