# Dev-prompt benchmark. Every item runs on every model; replies are graded by the
# deterministic checks (must / must_not, case-insensitive regex) and, when a judge is set
# in models.yaml `bench.judges`, by the rubric. Generated code is never executed.
# Grow toward 150-200 items to tighten the accuracy interval (see README).
name: dev
version: 1
items:
  # --- chore ------------------------------------------------------------------------
  - id: chore-commit-msg
    prompt: "Write a commit message for this staged change: renamed getUser to fetchUser in api/users.ts and updated its 4 callers."
    must: ['fetchUser', '^\W*\w.{0,72}$|\n']
    must_not: ['```(python|ts|js)']
    rubric: "Imperative subject line under 72 chars naming the rename; optional short body. No code."
  - id: chore-commit-msg-fix
    prompt: "Write a conventional commit message for a fix that stops the login form submitting twice on double click."
    must: ['^\W*fix(\(.+\))?:', 'double|twice']
    rubric: "Conventional commit 'fix:' prefix, describes double submission."
  - id: chore-gitignore
    prompt: "Give me a .gitignore for a Python project using venv, pytest and mypy."
    must: ['\.venv|venv/', '__pycache__', '\.pytest_cache', '\.mypy_cache']
    rubric: "Covers virtualenv, bytecode, pytest and mypy caches."
  - id: chore-rename-var
    prompt: "Rename the variable `tmp` to `retry_count` in this snippet: `tmp = 0\nwhile tmp < 3:\n    tmp += 1`"
    must: ['retry_count = 0', 'retry_count < 3', 'retry_count \+= 1']
    must_not: ['\btmp\b']
  - id: chore-typo-readme
    prompt: "Fix the typos in this README line: 'Instal the pakage with pip and then importt it.'"
    must: ['Install', 'package', '\bimport\b']
    must_not: ['pakage', 'importt']
  - id: chore-changelog
    prompt: "Write a CHANGELOG entry for version 2.3.0: added CSV export, fixed timezone bug in reports, dropped Python 3.8."
    must: ['2\.3\.0', 'CSV', 'time ?zone', '3\.8']
    rubric: "Keep-a-changelog style sections (Added/Fixed/Removed) for the three changes."
  - id: chore-pr-title
    prompt: "Suggest a short PR title for: adds retry with exponential backoff to the payment webhook client."
    must: ['retr', 'backoff|webhook']
  - id: chore-json-format
    prompt: 'Pretty-print this JSON with 2-space indent: {"a":1,"b":{"c":[1,2]}}'
    must: ['\n  "a": 1', '"c": \[']
  - id: chore-sort-imports
    prompt: "Sort these Python imports per isort defaults: import sys\nimport requests\nimport os\nfrom typing import Any"
    must: ['import os\s+import sys']
    rubric: "Stdlib group (os, sys, typing) before third-party (requests), alphabetical."
  - id: chore-env-example
    prompt: "Write a .env.example for an app that needs DATABASE_URL, REDIS_URL and a SECRET_KEY. No real values."
    must: ['DATABASE_URL=', 'REDIS_URL=', 'SECRET_KEY=']
    must_not: ['SECRET_KEY=\w{16,}']
  - id: chore-docstring
    prompt: "Add a docstring to: def clamp(x, lo, hi): return max(lo, min(x, hi))"
    must: ['"""', 'def clamp']
  - id: chore-license-header
    prompt: "Write an MIT license header comment for a TypeScript file, copyright 2026 Acme Inc."
    must: ['MIT', '2026', 'Acme']
  - id: chore-yaml-fix
    prompt: "This YAML fails to parse, fix it: 'services:\n  web:\n   image: nginx\n  ports:\n    - 80:80'"
    must: ['services:', 'image: nginx', 'ports:']
    rubric: "ports is indented under web at the same level as image; valid YAML."
  - id: chore-semver
    prompt: "Current version 1.4.2. I removed a public function. What is the next semver version and why?"
    must: ['2\.0\.0']
  - id: chore-makefile-target
    prompt: "Add a Makefile target `lint` that runs ruff check on src and tests."
    must: ['^lint:', 'ruff check']
    rubric: "Recipe line is tab-indented."

  # --- edit -------------------------------------------------------------------------
  - id: edit-dark-mode
    prompt: "Add a dark mode toggle to this React settings page component: function Settings() { return <div><h1>Settings</h1></div> }"
    must: ['useState', 'dark', 'onClick|onChange']
    rubric: "Toggle state, switches a theme class or style, keeps the heading."
  - id: edit-add-param
    prompt: "Add an optional `timeout` parameter (default 10 seconds) to this function and pass it to requests.get: def fetch(url): return requests.get(url).json()"
    must: ['timeout\s*[:=]', 'requests\.get\(url,\s*timeout=timeout\)']
  - id: edit-pagination
    prompt: "Add limit/offset pagination to this FastAPI endpoint: @app.get('/items')\ndef items(): return db.all()"
    must: ['limit', 'offset']
    rubric: "Query params with sane defaults and bounds; slices or passes to the query."
  - id: edit-ts-types
    prompt: "Add TypeScript types to: function total(items) { return items.reduce((s, i) => s + i.price * i.qty, 0) }"
    must: ['price:\s*number', 'qty:\s*number', '\):\s*number']
  - id: edit-logging
    prompt: "Replace the print calls with the logging module in: def run():\n    print('start')\n    work()\n    print('done')"
    must: ['import logging', 'getLogger|logging\.(info|debug)']
    must_not: ['print\(']
  - id: edit-async
    prompt: "Convert this to async using httpx.AsyncClient: def get_all(urls): return [httpx.get(u).text for u in urls]"
    must: ['async def', 'AsyncClient', 'await']
    rubric: "Concurrent requests (gather) preferred; client closed via async with."
  - id: edit-flutter-button
    prompt: "In Flutter, change this ElevatedButton to have rounded corners of radius 16 and an orange background: ElevatedButton(onPressed: go, child: Text('Go'))"
    must: ['circular\(16', 'orange|0xFF']
  - id: edit-swift-optional
    prompt: "Make this Swift code safe when name is nil: let greeting = \"Hello, \" + user.name!"
    must: ['\?\?|if let|guard let']
    must_not: ['name!']
  - id: edit-env-config
    prompt: "Read the port from the PORT environment variable with a default of 8080 in this Node server: app.listen(3000)"
    must: ['process\.env\.PORT', '8080']
  - id: edit-sql-index
    prompt: "Write the SQL to add an index for queries filtering orders by customer_id and sorting by created_at desc."
    must: ['CREATE INDEX', 'customer_id', 'created_at']

  # --- debug ------------------------------------------------------------------------
  - id: debug-keyerror
    prompt: "Why does this raise KeyError and how do I fix it? config = {'host': 'x'}\nport = config['port']"
    must: ['KeyError|key', '\.get\(|in config']
  - id: debug-off-by-one
    prompt: "This should return the last 3 items but returns 2. Fix it: def last3(xs): return xs[len(xs)-2:]"
    must: ['xs\[-3:\]|len\(xs\)\s*-\s*3']
  - id: debug-mutable-default
    prompt: "Calling add('a') twice returns ['a', 'a'] on the second call. Why? def add(x, items=[]): items.append(x); return items"
    must: ['mutable|shared|same list', 'None']
  - id: debug-js-this
    prompt: "In this JS class, `this.count` is undefined inside the click handler. Why? class C { constructor(){ this.count=0; btn.addEventListener('click', this.inc) } inc(){ this.count++ } }"
    must: ['bind|arrow']
  - id: debug-async-forget
    prompt: "My function logs a Promise instead of the data: async function load(){ const r = fetch(url); console.log(r.json()) }"
    must: ['await fetch', 'await r\.json\(\)']
  - id: debug-race
    prompt: "Two threads increment a shared counter 1,000,000 times each in Python and the result is less than 2,000,000. Explain and fix."
    must: ['Lock|lock', 'atomic|race']
    rubric: "Explains read-modify-write race and fixes with threading.Lock (GIL does not make += atomic)."
  - id: debug-float
    prompt: "Why does 0.1 + 0.2 == 0.3 return false in JavaScript and how should a calculator app avoid it?"
    must: ['binary|floating', 'decimal|epsilon|integer']
  - id: debug-sql-n-plus-one
    prompt: "Our Django view takes 4 seconds listing 200 orders with their customer names. The template does order.customer.name. Fix it."
    must: ['select_related']
  - id: debug-react-loop
    prompt: "This React component re-renders forever. Why? function P(){ const [d,setD]=useState(); useEffect(()=>{ fetch('/a').then(r=>r.json()).then(setD) }); return <div/> }"
    must: ['dependency|\[\]']
  - id: debug-traceback
    prompt: "Traceback: TypeError: can only concatenate str (not \"int\") to str on line `msg = 'count: ' + n`. Fix it."
    must: ['str\(n\)|f["'']count: \{n\}']
  - id: debug-memory-leak
    prompt: "Node service memory grows until OOM. We add a listener to an EventEmitter on every HTTP request. Diagnose and fix."
    must: ['listener', 'removeListener|off\(|once\(']
  - id: debug-flutter-setstate
    prompt: "Flutter error: setState() called after dispose(). It happens when an HTTP call finishes after leaving the screen. Fix it."
    must: ['mounted']
  - id: debug-swift-main-thread
    prompt: "SwiftUI warning: Publishing changes from background threads is not allowed. It comes from a URLSession completion handler updating @Published. Fix it."
    must: ['MainActor|DispatchQueue\.main']
  - id: debug-deadlock
    prompt: "Our Postgres app deadlocks when two transactions transfer money between the same two accounts in opposite directions. Explain and fix."
    must: ['order|ordering|sorted', 'lock']
    rubric: "Lock rows in a consistent order (e.g. by account id), or retry on deadlock."
  - id: debug-hard-heisenbug
    prompt: "A Go service sometimes returns another user's data under load. Handlers store the current user in a package-level variable set by middleware. Find the bug and redesign."
    must: ['context|ctx', 'global|package-level|shared']
    rubric: "Identifies data race on shared variable; passes user via request context."

  # --- test -------------------------------------------------------------------------
  - id: test-unit-slugify
    prompt: "Write pytest unit tests for slugify(s) which lowercases, trims, and replaces runs of non-alphanumerics with single dashes."
    must: ['def test_', 'slugify\(', 'assert']
    rubric: "Covers case, trimming, collapsing separators, and an edge case like empty string."
  - id: test-jest-calc
    prompt: "Write Jest unit tests for a calculator add(a, b) that must return '0.3' for add('0.1', '0.2')."
    must: ['(test|it)\(', "expect\\(add\\(['\"]0\\.1['\"],\\s*['\"]0\\.2['\"]\\)\\)", '0\.3']
  - id: test-parametrize
    prompt: "Rewrite these as one parametrized pytest test: def test_a(): assert is_even(2)\ndef test_b(): assert not is_even(3)\ndef test_c(): assert is_even(0)"
    must: ['pytest\.mark\.parametrize', 'is_even']
  - id: test-mock-http
    prompt: "Write a pytest test for get_weather(city) which calls requests.get on an API; mock the HTTP call."
    must: ['mock|monkeypatch|responses|patch', 'get_weather']
  - id: test-flutter-widget
    prompt: "Write a Flutter widget test that taps a '+' button and checks a counter text goes from 0 to 1."
    must: ['testWidgets', "tap", "find\\.text\\(['\"]1['\"]\\)"]
  - id: test-xctest
    prompt: "Write an XCTest that checks a Calculator().factorial(5) returns 120 and factorial(-1) throws."
    must: ['XCTest', 'XCTAssertEqual', 'XCTAssertThrows']
  - id: test-property
    prompt: "Write a Hypothesis property-based test that reversing a list twice returns the original."
    must: ['hypothesis', '@given', 'st\.lists']
  - id: test-edge-cases
    prompt: "List the edge cases you would test for a function parse_duration('1h30m') -> seconds, then write the pytest tests."
    must: ['def test_', 'parse_duration']
    rubric: "Includes invalid input, zero, missing units, large values, and mixed order."
  - id: test-integration-db
    prompt: "Write a pytest fixture that gives each test a fresh SQLite database with the schema from schema.sql applied."
    must: ['@pytest\.fixture', 'sqlite3', 'schema\.sql']
  - id: test-coverage-gap
    prompt: "Here is a function and its only test. What is untested? def div(a, b):\n    if b == 0: raise ValueError('zero')\n    return a / b\n\ndef test_div(): assert div(4, 2) == 2"
    must: ['ValueError|zero|b == 0']

  # --- explain ----------------------------------------------------------------------
  - id: explain-cache-headers
    prompt: "Explain the difference between Cache-Control no-cache and no-store."
    must: ['no-cache', 'no-store', 'revalidat']
  - id: explain-git-rebase
    prompt: "Explain git rebase vs merge to a junior developer, and when to use each."
    must: ['rebase', 'merge', 'history']
  - id: explain-big-o
    prompt: "What is the time complexity of looking up a key in a Python dict, and what is the worst case?"
    must: ['O\(1\)', 'O\(n\)']
  - id: explain-cors
    prompt: "Explain why my browser blocks a fetch to another domain while curl works."
    must: ['CORS|origin', 'Access-Control-Allow-Origin']
  - id: explain-react-keys
    prompt: "Explain why React needs keys on list items and what goes wrong with index keys."
    must: ['key', 'reorder|order|identity']
  - id: explain-flutter-state
    prompt: "Explain StatelessWidget vs StatefulWidget in Flutter."
    must: ['StatelessWidget', 'StatefulWidget', 'setState']
  - id: explain-swiftui-state
    prompt: "Explain @State vs @Binding vs @StateObject in SwiftUI."
    must: ['@State', '@Binding', '@StateObject']
  - id: explain-idempotency
    prompt: "Explain idempotency keys for a payments API and how the server should store them."
    must: ['idempoten', 'key', 'retry|duplicate']
  - id: explain-jwt
    prompt: "Explain how JWT signature verification works and why alg=none is dangerous."
    must: ['signature', 'none']
  - id: explain-tcp-handshake
    prompt: "Explain the TCP three-way handshake."
    must: ['SYN', 'ACK']
  - id: explain-regex
    prompt: "Explain what this regex matches: ^(?=.*\\d)(?=.*[A-Z]).{8,}$"
    must: ['digit|number', 'upper', '8']
  - id: explain-event-loop
    prompt: "Explain the JavaScript event loop, microtasks vs macrotasks, with the output order of: setTimeout(()=>log(1)); Promise.resolve().then(()=>log(2)); log(3)"
    must: ['3[^0-9]+2[^0-9]+1|3, 2, 1']

  # --- design -----------------------------------------------------------------------
  - id: design-rate-limiter
    prompt: "Design a rate limiter for a public API: 100 requests per minute per key, across 20 app servers."
    must: ['redis|shared|central', 'token bucket|sliding window|fixed window']
    rubric: "Shared store, algorithm choice with trade-offs, atomicity (Lua/INCR), headers like Retry-After."
  - id: design-url-shortener
    prompt: "Design a URL shortener handling 10k writes/s and 1M reads/s."
    must: ['cache', 'id|hash|base62']
    rubric: "ID generation without collisions, read caching, storage choice, redirect code."
  - id: design-calc-architecture
    prompt: "Design the architecture for a scientific calculator shipped as React Native, SwiftUI and Flutter apps that must give identical results."
    must: ['shared|common|core', 'decimal|precision']
    rubric: "Single source of truth for math rules (shared spec or core + conformance tests), decimal math, consistent rounding."
  - id: design-billing-ledger
    prompt: "Design the data model for a multi-tenant billing service with an event-sourced ledger, from scratch, production-grade."
    must: ['tenant', 'event', 'ledger']
    rubric: "Immutable ledger events, double entry, tenant isolation, idempotency, projections, currency handling."
  - id: design-notifications
    prompt: "Design a notification system that sends email, SMS and push with user preferences and retries."
    must: ['queue', 'retry', 'preference']
  - id: design-feature-flags
    prompt: "Design a feature flag service with gradual rollouts and kill switches for mobile clients."
    must: ['rollout|percentage', 'cache|offline|default']
  - id: design-offline-sync
    prompt: "Design offline-first sync for a notes app on iOS and Android with conflict resolution."
    must: ['conflict', 'CRDT|last.write|vector|version']
  - id: design-search
    prompt: "Design product search with typo tolerance and filters for 5M products."
    must: ['index', 'fuzzy|typo|n-gram|ngram']
  - id: design-multi-region
    prompt: "Design a multi-region active-active architecture for a chat service with ordering guarantees per conversation."
    must: ['region', 'partition|shard|conversation']
    rubric: "Per-conversation ordering via home region or partition key; replication and failover trade-offs."
  - id: design-frontier-consensus
    prompt: "Design a consensus-backed configuration store with linearizable reads, explain leader election, log compaction and how you would prove safety under network partitions."
    must: ['leader', 'quorum|majority', 'snapshot|compaction']
    rubric: "Raft or Paxos with correct quorum reasoning, read-index or lease reads, compaction, safety argument."
  - id: design-api-versioning
    prompt: "How should we version a public REST API used by mobile apps that update slowly?"
    must: ['version', 'deprecat|backward']
  - id: design-secrets
    prompt: "Design secrets management for 40 microservices on Kubernetes, including rotation."
    must: ['rotat', 'vault|secret manager|KMS|external secrets']
  - id: design-tech-company
    prompt: "I need you to make the best possible tech company: give the product strategy, team structure and engineering principles for year one."
    must: ['product', 'team', 'principle']
    rubric: "Concrete, prioritised plan; avoids generic platitudes."

  # --- refactor ---------------------------------------------------------------------
  - id: refactor-retry-dup
    prompt: "Refactor to remove the duplicated retry logic across these two functions into one decorator: def a():\n  for i in range(3):\n    try: return call_a()\n    except IOError: time.sleep(2**i)\ndef b():\n  for i in range(3):\n    try: return call_b()\n    except IOError: time.sleep(2**i)"
    must: ['def retry', '@retry|retry\(']
  - id: refactor-extract-function
    prompt: "Refactor this 30-line handler by extracting validation, persistence and notification into functions. Show the result. def handle(req):\n  if not req.email or '@' not in req.email: raise Bad()\n  if len(req.name) > 50: raise Bad()\n  u = User(email=req.email, name=req.name)\n  db.add(u); db.commit()\n  mail.send(req.email, 'welcome')\n  return u"
    must: ['def validate', 'def (save|persist)', 'def (notify|send)']
  - id: refactor-strategy
    prompt: "Refactor this if/elif chain over payment methods (card, paypal, crypto) into a strategy pattern in TypeScript."
    must: ['interface|abstract', 'card|Card', 'paypal|PayPal']
  - id: refactor-callbacks
    prompt: "Refactor this callback pyramid to async/await: getUser(id, (u) => getOrders(u, (o) => getItems(o, (i) => done(i))))"
    must: ['async', 'await getUser|await getOrders']
  - id: refactor-god-class
    prompt: "We have a 2,000-line Python class OrderManager doing pricing, tax, inventory and emails across many files. Plan the refactor into modules without breaking callers."
    must: ['pricing', 'tax', 'inventory', 'facade|deprecat|backward']
    rubric: "Incremental plan: tests first, extract modules, keep a facade, deprecate gradually."
  - id: refactor-dart-null-safety
    prompt: "Migrate this Dart code to sound null safety: String greet(String name) { if (name == null) return 'Hi'; return 'Hi ' + name; }"
    must: ['String\?']
  - id: refactor-swift-combine
    prompt: "Refactor this Swift completion-handler API to async/await: func load(completion: @escaping (Result<Data, Error>) -> Void)"
    must: ['async throws', 'func load\(\) async']
  - id: refactor-sql-orm
    prompt: "Refactor raw SQL string concatenation into parameterised queries: cur.execute(\"SELECT * FROM users WHERE name = '\" + name + \"'\")"
    must: ['%s|\?|:name']
    must_not: ["' \\+ name"]

  # --- build ------------------------------------------------------------------------
  - id: build-cli-todo
    prompt: "Build a small Python CLI todo app with add, list and done commands that stores tasks in a JSON file."
    must: ['argparse|click|typer', 'json', 'def (add|list|done)']
  - id: build-rn-counter
    prompt: "Build a React Native counter screen with increment, decrement and reset buttons."
    must: ['useState', 'Button|TouchableOpacity|Pressable', 'reset']
  - id: build-flutter-login
    prompt: "Build a Flutter login screen with email and password validation and a disabled submit button until valid."
    must: ['TextFormField|TextField', 'validator|isValid', 'onPressed:\s*(null|.*\?)']
  - id: build-swiftui-list
    prompt: "Build a SwiftUI list of tasks with add and swipe-to-delete."
    must: ['List', 'onDelete', '@State']
  - id: build-rest-crud
    prompt: "Build a FastAPI CRUD service for books (title, author, year) with in-memory storage and proper 404s."
    must: ['FastAPI', '@app\.(get|post|put|delete)', '404']
  - id: build-websocket-chat
    prompt: "Build a minimal websocket chat server in Node with rooms."
    must: ['WebSocket|ws|socket\.io', 'room']
  - id: build-calc-rn
    prompt: "Build a scientific calculator app in React Native with the cleanest possible UI: sin, cos, tan, log, ln, sqrt, power, factorial, DEG/RAD toggle and history."
    must: ['sin', 'factorial|!', 'DEG|RAD', 'history']
    rubric: "Complete runnable screen; decimal-safe math or explicit rounding; clean consistent styling."
  - id: build-calc-flutter
    prompt: "Build a scientific calculator app in Flutter with the cleanest possible UI: sin, cos, tan, log, ln, sqrt, power, factorial, DEG/RAD toggle and history."
    must: ['sin', 'factorial|!', 'DEG|RAD', 'history']
    rubric: "Complete runnable app; clean theme; correct angle mode handling."
  - id: build-calc-swift
    prompt: "Build a scientific calculator app in SwiftUI with the cleanest possible UI: sin, cos, tan, log, ln, sqrt, power, factorial, DEG/RAD toggle and history."
    must: ['sin', 'factorial|!', 'DEG|RAD', 'history']
    rubric: "Complete SwiftUI app; Decimal or explicit rounding; clean grid layout."
  - id: build-calc-all
    prompt: "Build a scientific calculator app with the best possible and cleanest UI for iOS and Android. It needs to be in React Native, Swift, and Flutter."
    max_tokens: 16000
    must: ['react', 'swift', 'flutter|dart']
    rubric: "All three implementations present and complete, with consistent behaviour and styling across them."
  - id: build-rate-limit-middleware
    prompt: "Build an Express middleware implementing a token bucket rate limiter per API key, with tests."
    must: ['token|bucket', 'next\(\)', '429']
  - id: build-markdown-parser
    prompt: "Build a tiny Markdown-to-HTML converter in Python supporting headings, bold, italics, links and lists, without libraries."
    must: ['<h1>|<h\{', '<strong>|<b>', '<a href']
  - id: build-scheduler
    prompt: "Build a cron expression parser in TypeScript that returns the next 5 run times for an expression like '*/15 9-17 * * 1-5'."
    must: ['function|=>', 'next']
    rubric: "Handles ranges, steps, lists for all five fields; correct next-time computation."
  - id: build-frontier-compiler
    prompt: "Build a from-scratch interpreter in Python for a small language with integers, variables, if/while, functions and closures: tokenizer, parser to an AST, and evaluator."
    max_tokens: 16000
    must: ['class .*Token|def tokeni', 'class .*(Parser|Node)', 'def eval|def interpret']
    rubric: "Working tokenizer, recursive-descent parser, AST, environments with closures."
  - id: build-image-resizer
    prompt: "Build a Go HTTP service that accepts an uploaded image and returns a 256px-wide thumbnail, with size limits."
    must: ['net/http', 'image', 'MaxBytesReader|limit']
  - id: build-dashboard
    prompt: "Build a React dashboard page showing KPIs and a line chart from a /api/metrics endpoint, with loading and error states."
    must: ['useEffect', 'loading', 'error']
  - id: build-auth-flow
    prompt: "Build email + password signup and login for a Flask app with hashed passwords and session cookies."
    must: ['generate_password_hash|bcrypt|argon2', 'session']
    must_not: ['password\s*==\s*']

  # --- hard: multi-file builds (added 2026-11-11 to separate strong models) -----------
  - id: hard-build-fastapi-auth
    prompt: "Build a FastAPI service split into app/main.py, app/auth.py, app/models.py and tests/test_auth.py: email+password signup and login, bcrypt hashing, JWT access tokens (15 min) and refresh tokens (7 days) with rotation, and a dependency that protects /me. Give every file in full."
    max_tokens: 16000
    must: ['app/main\.py', 'app/auth\.py', 'app/models\.py', 'tests/test_auth\.py', 'bcrypt|passlib', 'refresh', 'Depends\(']
    rubric: "All four files complete and consistent with each other; refresh tokens rotate (old one invalidated); /me rejects missing or expired tokens; tests cover signup, login, refresh rotation and an expired token."
  - id: hard-build-react-query-crud
    prompt: "Build a React + TypeScript todo app using TanStack Query against a REST API, in files src/api.ts, src/hooks/useTodos.ts, src/components/TodoList.tsx and src/App.tsx. Include optimistic updates with rollback on error for create, toggle and delete."
    max_tokens: 16000
    must: ['src/api\.ts', 'useTodos', 'TodoList\.tsx', 'onMutate', 'onError', 'setQueryData|invalidateQueries']
    rubric: "Optimistic update in onMutate with snapshot, rollback in onError, settle with invalidate; types shared across files; no missing imports."
  - id: hard-build-go-worker-pool
    prompt: "Write a Go package with a bounded worker pool (worker.go), a job queue with retries and exponential backoff plus jitter (queue.go), graceful shutdown on SIGTERM that drains in-flight jobs (main.go), and table-driven tests (worker_test.go)."
    max_tokens: 16000
    must: ['worker\.go', 'queue\.go', 'main\.go', 'worker_test\.go', 'context\.|ctx', 'SIGTERM', 'sync\.WaitGroup|errgroup']
    rubric: "Pool size is bounded; retries use backoff with jitter and a max; shutdown stops intake and waits for in-flight jobs with a timeout; tests are table-driven and race-safe."
  - id: hard-build-cli-sync
    prompt: "Build a Python CLI (package with cli.py, sync.py, state.py and tests) that syncs a local folder to S3: only uploads changed files by content hash, keeps state in SQLite, supports --dry-run and --delete, and retries throttled requests."
    max_tokens: 16000
    must: ['cli\.py', 'sync\.py', 'state\.py', 'sqlite3', 'dry.run', 'hash|sha256|md5', 'boto3']
    rubric: "Change detection by content hash stored in SQLite; dry-run makes no writes; delete removes only remote files missing locally; throttling retried with backoff; tests mock S3."
  - id: hard-build-flutter-offline
    prompt: "Build a Flutter notes app with offline-first sync: lib/data/local_db.dart (sqflite), lib/data/api.dart, lib/data/sync_service.dart with last-write-wins conflict resolution by updated_at, lib/ui/notes_page.dart. Give every file."
    max_tokens: 16000
    must: ['local_db\.dart', 'api\.dart', 'sync_service\.dart', 'notes_page\.dart', 'sqflite', 'updated_?at']
    rubric: "Writes go local first and queue for sync; sync merges both directions with last-write-wins on updated_at; deletions are tombstoned, not lost; UI reads from the local DB."
  - id: hard-build-swift-networking
    prompt: "Build a SwiftUI app module with Networking/APIClient.swift (async/await, typed errors, retry on 5xx), Models/User.swift (Codable with snake_case keys), ViewModels/UsersViewModel.swift (@MainActor, pagination) and Views/UsersView.swift (infinite scroll)."
    max_tokens: 16000
    must: ['APIClient\.swift', 'User\.swift', 'UsersViewModel\.swift', 'UsersView\.swift', 'async', '@MainActor', 'convertFromSnakeCase|CodingKeys']
    rubric: "Async/await throughout; retries only on 5xx with a cap; view model on MainActor loads next page near the end of the list without duplicate requests."
  - id: hard-build-postgres-migrations
    prompt: "Design and write SQL migrations (001_init.sql, 002_add_orders.sql, 003_backfill.sql) and a Python runner (migrate.py) for a Postgres schema with users, orders and order_items, foreign keys, indexes for the common queries, and a zero-downtime backfill of a new NOT NULL column."
    max_tokens: 16000
    must: ['001_init\.sql', '002_add_orders\.sql', '003_backfill\.sql', 'migrate\.py', 'FOREIGN KEY|REFERENCES', 'CREATE INDEX', 'NOT NULL']
    rubric: "New NOT NULL column added nullable, backfilled in batches, then constrained; runner records applied versions in a table and runs each migration in a transaction."
  - id: hard-build-websocket-presence
    prompt: "Build a Node.js + TypeScript WebSocket server (server.ts, presence.ts, rooms.ts) with rooms, presence (who is online), heartbeats that drop dead connections, and Redis pub/sub so it scales to several instances. Include a small client example."
    max_tokens: 16000
    must: ['server\.ts', 'presence\.ts', 'rooms\.ts', 'redis', 'ping|heartbeat', 'publish|subscribe']
    rubric: "Presence stays correct across instances via Redis; heartbeat timeout removes dead sockets and broadcasts leave; rooms isolate messages."
  - id: hard-build-rn-auth-flow
    prompt: "Build a React Native (Expo, TypeScript) auth flow: screens/LoginScreen.tsx, screens/HomeScreen.tsx, auth/AuthContext.tsx with secure token storage (expo-secure-store), automatic token refresh on 401 in api/client.ts, and navigation that switches stacks on login state."
    max_tokens: 16000
    must: ['LoginScreen\.tsx', 'HomeScreen\.tsx', 'AuthContext\.tsx', 'client\.ts', 'SecureStore|expo-secure-store', '401']
    rubric: "Tokens stored in SecureStore, never AsyncStorage; a single in-flight refresh shared by concurrent 401s; failed refresh logs out; navigation switches stacks."
  - id: hard-build-event-sourcing
    prompt: "Implement a minimal event-sourced bank account in Python: events.py, aggregate.py (apply/replay), store.py (append-only with optimistic concurrency by expected version), projections.py (balance read model) and tests."
    max_tokens: 16000
    must: ['events\.py', 'aggregate\.py', 'store\.py', 'projections\.py', 'expected_version|version', 'def test_']
    rubric: "Append rejects a stale expected version; aggregate rebuilds state by replay; overdraft is rejected as a domain rule; projection rebuilds from the event log."
  - id: hard-build-k8s-deploy
    prompt: "Write Kubernetes manifests for a web API: deployment.yaml (3 replicas, readiness and liveness probes, resource limits, rolling update with maxUnavailable 0), service.yaml, hpa.yaml (CPU 70%), configmap.yaml and a PodDisruptionBudget."
    max_tokens: 10000
    must: ['kind: Deployment', 'readinessProbe', 'livenessProbe', 'maxUnavailable: 0', 'HorizontalPodAutoscaler', 'PodDisruptionBudget', 'resources:']
    rubric: "Manifests are valid YAML and consistent (labels/selectors match); probes are different endpoints or thresholds; HPA targets the deployment; PDB keeps at least 2 pods."
  - id: hard-build-plugin-system
    prompt: "Build a Python plugin system: core/registry.py (entry-point discovery), core/hooks.py (typed hook specs with priorities), plugins/example_plugin.py and tests showing two plugins modifying the same hook in priority order, with one plugin failing without breaking the rest."
    max_tokens: 16000
    must: ['registry\.py', 'hooks\.py', 'example_plugin\.py', 'entry.points|importlib\.metadata', 'priorit', 'def test_']
    rubric: "Discovery via entry points; hooks run in priority order; a failing plugin is isolated and reported; tests prove ordering and isolation."
  - id: hard-build-graphql-dataloader
    prompt: "Build a GraphQL API in TypeScript (schema.ts, resolvers.ts, loaders.ts) for authors and books where listing 50 books with their authors issues one author query, not 50. Show the DataLoader setup per request."
    max_tokens: 12000
    must: ['schema\.ts', 'resolvers\.ts', 'loaders\.ts', 'DataLoader', 'context']
    rubric: "DataLoader created per request in context; batch function returns results in key order; N+1 removed; explains why per-request scope matters."
  - id: hard-build-feature-flag-sdk
    prompt: "Build a feature-flag SDK in TypeScript (client.ts, evaluate.ts, cache.ts, tests) with percentage rollouts that are sticky per user (hash-based), targeting rules, local caching with background refresh, and a safe default when the server is down."
    max_tokens: 14000
    must: ['client\.ts', 'evaluate\.ts', 'cache\.ts', 'hash|murmur|sha', 'default', 'describe\(|test\(']
    rubric: "Rollout bucket is deterministic per user and flag; rules evaluate before rollout; stale cache served on failure; tests cover stickiness and the offline default."
  - id: hard-build-calc-engine
    prompt: "Build a calculator expression engine in Python: lexer.py, parser.py (precedence climbing, unary minus, right-associative ^, functions sin/cos/sqrt), evaluator.py and tests including 2^3^2, -2^2 and malformed input."
    max_tokens: 12000
    must: ['lexer\.py', 'parser\.py', 'evaluator\.py', 'def test_', '512', 'sqrt']
