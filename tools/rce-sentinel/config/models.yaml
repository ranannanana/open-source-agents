    - { id: seat/claude-opus-5-5, provider: seat, family: anthropic, price_in: 4.0, price_out: 20.0, price_cached_in: 0.20, context_tokens: 1000000, uses: [dev], quality: 0.93, tps: 40 }
    # Ollama cloud, larger models (see the tier2 note).
    - { id: "kimi-k2.6:cloud", provider: ollama, family: moonshot, price_in: 0.0, price_out: 0.0, price_cached_in: 0.0, context_tokens: 262144, uses: [bench], quality: 0.76, tps: 40 }
