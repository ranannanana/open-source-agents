    - { id: "kimi-k3:cloud", provider: ollama, family: moonshot, price_in: 0.0, price_out: 0.0, price_cached_in: 0.0, context_tokens: 262144, uses: [bench], quality: 0.8, tps: 40 }
    - { id: "kimi-k3.1-pro:cloud", provider: ollama, family: moonshot, price_in: 0.0, price_out: 0.0, price_cached_in: 0.0, context_tokens: 262144, uses: [bench], quality: 0.82, tps: 35 }
    # Baseline to beat, benchmark only: never routed to. Cost comes from OpenRouter's usage.
    - { id: "openrouter/auto", provider: openrouter, family: openrouter, price_in: 0, price_out: 0, context_tokens: 1000000, uses: [bench] }

# Decision model for prompt pre-eval (`rce-sentinel route`): TypeSafe Jev returns
# probabilities, no text. $0.042 per 1M input tokens, output free (models.dev, 2026-10-14).
# Used only when the free rule tagger is unsure. The first entry whose key is set wins.
decision:
  - { id: jev-1.13-free, provider: opencode, base_url: "https://opencode.ai/inference/systemone/v1", timeout_s: 5, uses: [dev] }
  - { id: typesafe/jev-1.14, provider: openrouter, timeout_s: 5 }

# The naive baseline the cost report compares against: every unit judged by this model, no caches.
# `rce-sentinel bench run`: default models (cheap to frontier, plus the openrouter/auto
# baseline) and the judges that grade rubrics; a judge never grades its own family.
bench:
  models: ["openai/gpt-6-luna", "deepseek/deepseek-v4.1-flash", "moonshotai/kimi-k2.7-code",
           "google/gemini-3.8-flash", "anthropic/claude-sonnet-5.5", "openai/gpt-6.1-sol",
           "anthropic/claude-opus-5.5", "openrouter/auto"]
  judges: ["anthropic/claude-sonnet-5.5", "openai/gpt-6.1-sol", "google/gemini-4-argon"]
  # `--set seat`: no OpenRouter. Claude through your login plus free local models.
  sets:
    seat:
      # gemma4:31b-cloud asked for paid credits on 2026-11-11, so it is left out.
      models: ["qwen2.5:3b", "qwen2.5-coder:7b", "apple-foundationmodel",
               "seat/claude-haiku-5-5", "seat/claude-sonnet-5-5", "seat/claude-opus-5-5"]
      judges: ["seat/claude-sonnet-5-5", "seat/claude-opus-5-5"]
      same_family_judge: true   # only one strong family here; the judge is never the model
    ollama-cloud:   # needs Ollama usage credits; Claude via your login as the reference
      models: ["deepseek-v4.1-flash:cloud", "glm-5.3-flash:cloud", "minimax-m3.1-flash:cloud", "mimo-v2.6-flash:cloud", "minimax-m3:cloud", "kimi-k2.6:cloud", "kimi-k2.7-code:cloud", "glm-5.3:cloud", "deepseek-v4-pro:cloud", "mistral-large-4:cloud", "mimo-v2.6-pro:cloud", "nemotron-3-super:cloud", "nemotron-3-ultra:cloud", "kimi-k3:cloud", "kimi-k3.1-pro:cloud",
               "seat/claude-haiku-5-5", "seat/claude-sonnet-5-5", "seat/claude-opus-5-5"]
      judges: ["seat/claude-sonnet-5-5", "seat/claude-opus-5-5"]
      same_family_judge: true

baseline_model: kimi-k2.6

# Provider prompt caches expire; a prefix used within this window counts as warm.
prompt_cache_ttl_seconds: 300
